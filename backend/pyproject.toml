[project]
name = "sushruta-backend"
version = "0.1.0"
description = "Sushruta Safety Core & Data Pipeline — P0 backend (proof of concept, NOT a medical device)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
