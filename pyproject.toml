[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Sushruta Phase 1 FastAPI backend and safety simulator"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
